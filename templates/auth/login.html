{% extends "base.html" %}
{% block title %}Entrar — DJ VRC Booking{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-title">ENTRAR</div>
    <p class="auth-sub">Acesse sua conta no DJ VRC Booking</p>

    <a href="{{ url_for('auth.discord_login') }}" class="discord-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057.1 18.08.11 18.1.132 18.115a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
      Entrar com Discord
    </a>

    <div class="divider">ou com e-mail</div>

    <form method="post">
      <div class="form-group">
        <label class="form-label">E-mail</label>
        <input class="form-input" type="email" name="email" value="{{ email or '' }}" placeholder="seu@email.com" required />
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input class="form-input" type="password" name="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-bottom:1rem;">Entrar</button>
    </form>

    <div class="auth-footer">
      <a href="{{ url_for('auth.forgot_password') }}" style="color:var(--muted); font-size:.8rem;">Esqueci minha senha</a>
    </div>
    <div class="auth-footer">
      Não tem conta? <a href="{{ url_for('auth.register') }}">Cadastre-se</a>
    </div>
  </div>
</div>
{% endblock %}
