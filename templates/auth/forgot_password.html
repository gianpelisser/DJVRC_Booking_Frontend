{% extends "base.html" %}
{% block title %}Esqueci minha senha — DJ VRC Booking{% endblock %}
{% block content %}
<div style="min-height:80vh; display:flex; align-items:center; justify-content:center; padding:2rem;">
  <div style="width:100%; max-width:420px;">

    <div style="text-align:center; margin-bottom:2rem;">
      <h1 style="font-size:1.75rem; margin-bottom:.4rem;">ESQUECEU A SENHA?</h1>
      <p style="color:var(--muted); font-size:.9rem;">
        Digite seu e-mail e enviaremos um link para criar uma nova senha.
      </p>
    </div>

    <div class="card">
      <form method="post">
        <div class="form-group">
          <label class="form-label">E-mail da conta</label>
          <input class="form-input" type="email" name="email" required autofocus
                 placeholder="seu@email.com" />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Enviar link de redefinição
        </button>
      </form>
    </div>

    <div style="text-align:center; margin-top:1.25rem; font-size:.875rem; color:var(--muted);">
      Lembrou a senha?
      <a href="{{ url_for('auth.login') }}" style="color:var(--accent);">Voltar ao login</a>
    </div>

  </div>
</div>
{% endblock %}
