{% extends "base.html" %}
{% block title %}Esqueci a senha — DJ VRC Booking{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-title">ESQUECI A SENHA</div>
    <p class="auth-sub">Informe seu e-mail e enviaremos um link de recuperação.</p>
    <form method="post">
      <div class="form-group">
        <label class="form-label">E-mail</label>
        <input class="form-input" type="email" name="email" placeholder="seu@email.com" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Enviar link</button>
    </form>
    <div class="auth-footer"><a href="{{ url_for('auth.login') }}">← Voltar ao login</a></div>
  </div>
</div>
{% endblock %}
