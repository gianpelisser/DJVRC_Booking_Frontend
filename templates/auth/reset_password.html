{% extends "base.html" %}
{% block title %}Redefinir senha — DJ VRC Booking{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-title">NOVA SENHA</div>
    <p class="auth-sub">Escolha uma senha forte para sua conta.</p>
    <form method="post">
      <div class="form-group">
        <label class="form-label">Nova senha</label>
        <input class="form-input" type="password" name="password" placeholder="mínimo 8 caracteres" required minlength="8" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Redefinir senha</button>
    </form>
  </div>
</div>
{% endblock %}
