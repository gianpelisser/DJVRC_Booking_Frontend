{% extends "base.html" %}
{% block title %}Nova senha — DJ VRC Booking{% endblock %}
{% block content %}
<div style="min-height:80vh; display:flex; align-items:center; justify-content:center; padding:2rem;">
  <div style="width:100%; max-width:420px;">

    <div style="text-align:center; margin-bottom:2rem;">
      <h1 style="font-size:1.75rem; margin-bottom:.4rem;">NOVA SENHA</h1>
      <p style="color:var(--muted); font-size:.9rem;">
        Escolha uma senha forte com pelo menos 8 caracteres.
      </p>
    </div>

    <div class="card">
      <form method="post">
        <div class="form-group">
          <label class="form-label">Nova senha *</label>
          <input class="form-input" type="password" name="password" required autofocus
                 minlength="8" placeholder="mínimo 8 caracteres" />
        </div>
        <div class="form-group">
          <label class="form-label">Confirme a senha *</label>
          <input class="form-input" type="password" name="confirm_password" required
                 minlength="8" placeholder="repita a senha" id="confirm" />
          <div class="form-hint" id="matchHint"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
          Salvar nova senha
        </button>
      </form>
    </div>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const pw   = document.querySelector('input[name="password"]');
const conf = document.getElementById('confirm');
const hint = document.getElementById('matchHint');
const btn  = document.getElementById('submitBtn');

function check() {
  if (!conf.value) { hint.textContent = ''; return; }
  const match = pw.value === conf.value;
  hint.textContent = match ? '✓ Senhas coincidem' : '✕ Senhas não coincidem';
  hint.style.color = match ? 'var(--success)' : 'var(--danger)';
  btn.disabled = !match;
}
pw.addEventListener('input', check);
conf.addEventListener('input', check);
</script>
{% endblock %}
