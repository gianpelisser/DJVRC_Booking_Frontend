{% extends "base.html" %}
{% block title %}404 — Página não encontrada{% endblock %}
{% block content %}
<div style="min-height:70vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem;">
  <div>
    <div style="font-family:var(--font-d); font-size:8rem; color:rgba(0,229,255,.1); line-height:1;">404</div>
    <h2 style="margin-bottom:.5rem;">Página não encontrada</h2>
    <p style="margin-bottom:2rem;">O conteúdo que você procura não existe ou foi removido.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Voltar para o início</a>
  </div>
</div>
{% endblock %}
